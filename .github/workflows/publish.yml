name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify npm supports Trusted Publishing
        run: node scripts/verify-npm-version.mjs

      - name: Install frozen dependencies
        run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run release:check
      - run: npm run package:check
      - run: npm run smoke:load
      - run: npm run smoke:install

      - name: Publish provenance-backed package
        run: npm run release
        env:
          # Temporary first-publication fallback. Leave absent after Trusted Publisher setup.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

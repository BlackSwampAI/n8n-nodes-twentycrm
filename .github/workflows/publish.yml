name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use the lockfile npm version
        run: npm install --global npm@11.19.0

      - name: Verify npm supports Trusted Publishing
        run: node scripts/verify-npm-version.mjs

      - name: Install frozen dependencies
        run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run scan:source
      - run: npm run release:check
      - run: npm run package:check
      - run: npm run smoke:load
      - run: npm run smoke:install

      - name: Prepare tokenless npm authentication
        run: node scripts/prepare-npm-auth.mjs

      - name: Publish provenance-backed package
        run: npm run release

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run scan:published
